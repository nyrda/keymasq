name: Package

on:
  push:
    tags: ["v*"]
    paths:
      - ".github/workflows/package.yml"
      - ".github/actions/test-rpm/**"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PKGBUILD"
      - "README.md"
      - "assets/**"
      - "debian/**"
      - "docs/PACKAGING.md"
      - "docs/INSTALL.md"
      - "docs/STEAMOS.md"
      - "examples/**"
      - "keymasq/**"
      - "keymasq.install"
      - "packaging/appimage/**"
      - "packaging/aur/**"
      - "packaging/debian/**"
      - "packaging/pacman/**"
      - "packaging/rpm/**"
      - "polkit/**"
      - "pyproject.toml"
      - "scripts/build-packages.sh"
      - "scripts/build-source-tarball.sh"
      - "scripts/rpm-*.sh"
      - "scripts/publish-repos.sh"
      - "systemd/**"
      - "sysusers.d/**"
      - "tests/**"
      - "tmpfiles.d/**"
      - "udev/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build the prerelease from
        required: true
        default: master
        type: string
      prerelease_tag:
        description: GitHub prerelease tag to create, for example v0.3.0-rc1
        required: true
        type: string
      prerelease_version:
        description: Package version to embed, for example 0.3.0rc1
        required: true
        type: string

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KEYMASQ_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

jobs:
  version-metadata:
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      checkout_sha: ${{ steps.meta.outputs.checkout_sha }}
      is_manual_prerelease: ${{ steps.meta.outputs.is_manual_prerelease }}
      is_stable_release: ${{ steps.meta.outputs.is_stable_release }}
      python_version: ${{ steps.meta.outputs.python_version }}
      debian_version: ${{ steps.meta.outputs.debian_version }}
      rpm_version: ${{ steps.meta.outputs.rpm_version }}
      pkgver: ${{ steps.meta.outputs.pkgver }}
      source_version: ${{ steps.meta.outputs.source_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.KEYMASQ_CHECKOUT_REF }}
          persist-credentials: false

      - name: Compute build version metadata
        id: meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          CHECKOUT_REF: ${{ env.KEYMASQ_CHECKOUT_REF }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          PRERELEASE_VERSION: ${{ inputs.prerelease_version }}
        run: |
          set -euo pipefail
          base_version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          checkout_ref="$CHECKOUT_REF"
          checkout_sha="$(git rev-parse HEAD)"
          is_manual_prerelease=false
          is_stable_release=false
          release_tag=""
          release_name=""

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$PRERELEASE_TAG" || -z "$PRERELEASE_VERSION" ]]; then
              echo "workflow_dispatch requires prerelease_tag and prerelease_version" >&2
              exit 1
            fi
            if [[ "$PRERELEASE_TAG" != v* ]]; then
              echo "prerelease_tag must start with 'v'" >&2
              exit 1
            fi

            python_version="$PRERELEASE_VERSION"
            debian_version="$(python3 - "$PRERELEASE_VERSION" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          match = re.fullmatch(r"(.+?)(?:(a|b|rc)(\d+)|\.dev(\d+))", version)
          if match is None:
              print(version)
          else:
              base, prerelease_label, prerelease_number, dev_number = match.groups()
              if dev_number is not None:
                  print(f"{base}~dev{dev_number}")
              else:
                  print(f"{base}~{prerelease_label}{prerelease_number}")
          PY
            )"
            rpm_version="$debian_version"
            pkgver="$PRERELEASE_VERSION"
            source_version="$PRERELEASE_VERSION"
            release_tag="$PRERELEASE_TAG"
            release_name="Keymasq prerelease ${PRERELEASE_TAG#v}"
            is_manual_prerelease=true
          elif [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF" != *-* ]]; then
            python_version="$base_version"
            debian_version=""
            rpm_version=""
            pkgver="$base_version"
            source_version="$base_version"
            release_tag="${GITHUB_REF#refs/tags/}"
            is_stable_release=true
          else
            python_version="$base_version"
            debian_version=""
            rpm_version=""
            pkgver="$base_version"
            source_version="$base_version"
          fi

          {
            printf 'checkout_ref=%s\n' "$checkout_ref"
            printf 'checkout_sha=%s\n' "$checkout_sha"
            printf 'is_manual_prerelease=%s\n' "$is_manual_prerelease"
            printf 'is_stable_release=%s\n' "$is_stable_release"
            printf 'python_version=%s\n' "$python_version"
            printf 'debian_version=%s\n' "$debian_version"
            printf 'rpm_version=%s\n' "$rpm_version"
            printf 'pkgver=%s\n' "$pkgver"
            printf 'source_version=%s\n' "$source_version"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'release_name=%s\n' "$release_name"
          } >> "$GITHUB_OUTPUT"

  build-source-tarball:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Apply prerelease Python version
        if: needs.version-metadata.outputs.is_manual_prerelease == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}"

      - name: Build source tarball
        run: |
          if [[ "${{ needs.version-metadata.outputs.is_manual_prerelease }}" == "true" ]]; then
            bash scripts/build-source-tarball.sh "${{ needs.version-metadata.outputs.source_version }}"
          else
            bash scripts/build-source-tarball.sh
          fi

      - name: Upload source tarball
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: source-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  build-pacman-arch:
    needs:
      - version-metadata
      - build-source-tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download source tarball
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-tarball
          path: dist/

      - name: Build rendered Arch package in Arch container
        env:
          KEYMASQ_PKGVER_OVERRIDE: ${{ needs.version-metadata.outputs.pkgver }}
        run: |
          docker run --rm \
            -e KEYMASQ_PKGVER_OVERRIDE \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                python \
                python-build \
                python-installer \
                python-setuptools \
                python-wheel
              bash packaging/pacman/ci-build.sh
            '

      - name: Upload Arch package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pacman-arch-package
          path: dist/arch/*.pkg.tar.*
          if-no-files-found: error

  test-pacman-arch:
    needs:
      - version-metadata
      - build-pacman-arch
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download Arch package
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pacman-arch-package
          path: dist/arch

      - name: Test Arch package in Arch container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              bash packaging/pacman/ci-test-installed.sh \
                "$(echo dist/arch/keymasq-*.pkg.tar.*)"
            '

  build-appimage:
    needs:
      - version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Apply prerelease Python version
        if: needs.version-metadata.outputs.is_manual_prerelease == 'true'
        env:
          KEYMASQ_PRERELEASE_PYTHON_VERSION: ${{ needs.version-metadata.outputs.python_version }}
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "$KEYMASQ_PRERELEASE_PYTHON_VERSION"

      - name: Build AppImage in Arch container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              bash packaging/appimage/get-dependencies.sh
              bash packaging/appimage/make-appimage.sh
              bash packaging/appimage/verify-appimage.sh \
                "$(echo dist/appimage/Keymasq-*.AppImage)"
            '

      - name: Upload AppImage
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: appimage-package
          path: dist/appimage/*.AppImage
          if-no-files-found: error

  build-deb:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Apply prerelease Debian build metadata
        if: needs.version-metadata.outputs.is_manual_prerelease == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}" \
            --debian-version "${{ needs.version-metadata.outputs.debian_version }}"

      - name: Build Debian package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                ca-certificates \
                debhelper \
                dh-sequence-python3 \
                lintian \
                pybuild-plugin-pyproject \
                python3-all \
                python3-build \
                python3-installer \
                python3-setuptools \
                python3-wheel
              bash packaging/debian/ci-build.sh
            '

      - name: Upload Debian artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: debian-package
          path: |
            dist/debian/*.deb
            dist/debian/*.changes
            dist/debian/*.buildinfo
          if-no-files-found: error

  test-deb:
    needs:
      - version-metadata
      - build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download Debian artifacts
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debian-package
          path: dist/debian

      - name: Test installed package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              bash packaging/debian/ci-test-installed.sh \
                "$(echo dist/debian/keymasq_*_all.deb)"
            '

  build-rpm-fedora:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fedora_release: [43, 44]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Apply prerelease RPM build metadata
        if: needs.version-metadata.outputs.is_manual_prerelease == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}" \
            --rpm-version "${{ needs.version-metadata.outputs.rpm_version }}"

      - name: Build Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:${{ matrix.fedora_release }} \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                desktop-file-utils \
                findutils \
                gcc \
                git \
                pyproject-rpm-macros \
                python3 \
                python3-dbus-next \
                python3-pip \
                python3-devel \
                python3-evdev \
                python3-gobject-base \
                python3-setuptools \
                python3-tomli-w \
                python3-wheel \
                python3-xlib \
                rpm-build \
                systemd-rpm-macros \
                shadow-utils \
                tar
              git config --global --add safe.directory /workspace
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload Fedora RPM
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rpm-fedora-fc${{ matrix.fedora_release }}-package
          path: dist/*fc${{ matrix.fedora_release }}*.rpm
          if-no-files-found: error

  build-rpm-opensuse:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Apply prerelease RPM build metadata
        if: needs.version-metadata.outputs.is_manual_prerelease == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}" \
            --rpm-version "${{ needs.version-metadata.outputs.rpm_version }}"

      - name: Build openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail

              zypper_retry() {
                local attempt
                for attempt in 1 2 3; do
                  if zypper --non-interactive "$@"; then
                    return 0
                  fi
                  if [[ "$attempt" -eq 3 ]]; then
                    return 1
                  fi
                  sleep $((attempt * 10))
                  zypper --non-interactive refresh --force || true
                done
              }

              zypper_retry refresh
              zypper_retry install \
                findutils \
                gcc \
                git \
                python3 \
                python3-pip \
                rpm-build \
                shadow \
                tar
              git config --global --add safe.directory /workspace
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload openSUSE RPM
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rpm-opensuse-package
          path: dist/*.opensuse.*.rpm
          if-no-files-found: error

  sign-rpm-packages:
    needs:
      - version-metadata
      - build-rpm-fedora
      - build-rpm-opensuse
    if: needs.version-metadata.outputs.is_stable_release == 'true' && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Install RPM signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg rpm

      - name: Download Fedora RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rpm-fedora-fc*-package
          path: dist/
          merge-multiple: true

      - name: Download openSUSE RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-opensuse-package
          path: dist/

      - name: Sign RPM artifacts
        env:
          RPM_SIGNING_KEY_PRIVATE_ASC: ${{ secrets.RPM_SIGNING_KEY_PRIVATE_ASC }}
          RPM_SIGNING_PUBLIC_KEY_PATH: dist/rpm-signing-key.asc
        run: |
          test -n "$RPM_SIGNING_KEY_PRIVATE_ASC"
          bash packaging/rpm/sign-rpms.sh dist/*.rpm

      - name: Upload signed RPM artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rpm-signed-packages
          path: |
            dist/*.rpm
            dist/rpm-signing-key.asc
          if-no-files-found: error

  test-rpm:
    name: Test RPM (${{ matrix.display_name }})
    needs:
      - version-metadata
      - build-rpm-fedora
      - build-rpm-opensuse
      - sign-rpm-packages
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          (
            needs.version-metadata.outputs.is_stable_release != 'true' &&
            needs.build-rpm-fedora.result == 'success' &&
            needs.build-rpm-opensuse.result == 'success'
          ) ||
          (
            needs.sign-rpm-packages.result == 'success' &&
            github.actor != 'nektos/act'
          )
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: Fedora 43
            artifact_name: rpm-fedora-fc43-package
            local_artifact_glob: dist/*fc43*.rpm
            container_image: fedora:43
            distro: fedora
            package_glob: dist/rpm/keymasq-*fc43*.rpm
          - display_name: Fedora 44
            artifact_name: rpm-fedora-fc44-package
            local_artifact_glob: dist/*fc44*.rpm
            container_image: fedora:44
            distro: fedora
            package_glob: dist/rpm/keymasq-*fc44*.rpm
          - display_name: openSUSE
            artifact_name: rpm-opensuse-package
            local_artifact_glob: dist/*.opensuse.*.rpm
            container_image: opensuse/tumbleweed:latest
            distro: opensuse
            package_glob: dist/rpm/keymasq-*.opensuse.*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Test RPM
        uses: ./.github/actions/test-rpm
        with:
          artifact-name: ${{ needs.version-metadata.outputs.is_stable_release == 'true' && 'rpm-signed-packages' || matrix.artifact_name }}
          local-artifact-glob: ${{ matrix.local_artifact_glob }}
          container-image: ${{ matrix.container_image }}
          distro: ${{ matrix.distro }}
          package-glob: ${{ matrix.package_glob }}
          signing-public-key-path: ${{ needs.version-metadata.outputs.is_stable_release == 'true' && 'dist/rpm/rpm-signing-key.asc' || '' }}

  release:
    needs:
      - version-metadata
      - build-source-tarball
      - build-pacman-arch
      - test-pacman-arch
      - build-appimage
      - build-deb
      - test-deb
      - sign-rpm-packages
      - test-rpm
    if: needs.version-metadata.outputs.is_stable_release == 'true' && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download source tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-tarball
          path: dist/

      - name: Download Debian artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debian-package
          path: dist/

      - name: Download signed RPM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-signed-packages
          path: dist/

      - name: Download AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage-package
          path: dist/

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum ./*.AppImage ./*.deb ./*.rpm ./*.tar.gz ./rpm-signing-key.asc > SHA256SUMS

      - name: Generate artifact attestations
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/rpm-signing-key.asc
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.rpm
            dist/*.tar.gz
            dist/rpm-signing-key.asc
            dist/SHA256SUMS
          generate_release_notes: true

  release-prerelease:
    needs:
      - version-metadata
      - build-source-tarball
      - build-pacman-arch
      - test-pacman-arch
      - build-appimage
      - build-deb
      - test-deb
      - build-rpm-fedora
      - build-rpm-opensuse
      - test-rpm
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.actor != 'nektos/act' &&
        needs.version-metadata.outputs.is_manual_prerelease == 'true' &&
        needs.build-source-tarball.result == 'success' &&
        needs.build-pacman-arch.result == 'success' &&
        needs.test-pacman-arch.result == 'success' &&
        needs.build-appimage.result == 'success' &&
        needs.build-deb.result == 'success' &&
        needs.test-deb.result == 'success' &&
        needs.build-rpm-fedora.result == 'success' &&
        needs.build-rpm-opensuse.result == 'success' &&
        needs.test-rpm.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download source tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-tarball
          path: dist/

      - name: Download Debian artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debian-package
          path: dist/

      - name: Download Fedora RPM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rpm-fedora-fc*-package
          path: dist/
          merge-multiple: true

      - name: Download openSUSE RPM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-opensuse-package
          path: dist/

      - name: Download AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage-package
          path: dist/

      - name: Generate prerelease checksums
        run: |
          cd dist
          sha256sum ./*.AppImage ./*.deb ./*.rpm ./*.tar.gz > SHA256SUMS

      - name: Generate prerelease artifact attestations
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.version-metadata.outputs.release_tag }}
          target_commitish: ${{ needs.version-metadata.outputs.checkout_sha }}
          name: ${{ needs.version-metadata.outputs.release_name }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Manual prerelease build from `${{ needs.version-metadata.outputs.checkout_ref }}`.

            Commit: https://github.com/${{ github.repository }}/commit/${{ needs.version-metadata.outputs.checkout_sha }}
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

  publish-repos:
    needs:
      - version-metadata
      - build-source-tarball
      - build-appimage
      - release
    if: needs.release.result == 'success' && vars.ENABLE_REPO_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: publish-repos

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Install repo tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg dpkg-dev apt-utils createrepo-c python3

      - name: Download Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debian-package
          path: dist/

      - name: Download signed RPM packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-signed-packages
          path: dist/

      - name: Download AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage-package
          path: dist/

      - name: Download source tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-tarball
          path: dist/

      - name: Publish to repository server
        env:
          RPM_SIGNING_KEY_PRIVATE_ASC: ${{ secrets.RPM_SIGNING_KEY_PRIVATE_ASC }}
          REPO_UPLOAD_URL: ${{ secrets.REPO_UPLOAD_URL }}
          REPO_UPLOAD_TOKEN: ${{ secrets.REPO_UPLOAD_TOKEN }}
        run: bash scripts/publish-repos.sh

  publish-copr:
    needs:
      - version-metadata
      - build-source-tarball
      - release
    if: needs.release.result == 'success' && vars.ENABLE_COPR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: publish-copr

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download source tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-tarball
          path: dist/

      - name: Build Fedora SRPM and publish to COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_OWNER: ${{ vars.COPR_OWNER }}
        run: |
          test -n "$COPR_CONFIG"
          test -n "$COPR_OWNER"

          docker run --rm \
            -e COPR_CONFIG \
            -e COPR_OWNER \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                copr-cli \
                desktop-file-utils \
                pyproject-rpm-macros \
                python3-devel \
                rpm-build \
                systemd-rpm-macros \
                tar
              install -d -m 700 ~/.config
              printf "%s\n" "$COPR_CONFIG" > ~/.config/copr
              bash packaging/rpm/build-fedora-rpm.sh --srpm dist "$(echo dist/keymasq-*.tar.gz)"
              copr-cli build "$COPR_OWNER/keymasq" dist/keymasq-*.src.rpm
            '

  publish-aur:
    needs:
      - version-metadata
      - publish-repos
      - release
      - test-pacman-arch
    if: needs.release.result == 'success' && needs.publish-repos.result == 'success' && vars.ENABLE_AUR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download source tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-tarball
          path: dist/

      - name: Configure SSH for AUR push
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Render AUR package files
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          archive_path="dist/keymasq-${version}.tar.gz"
          archive_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          aur_source_url="https://repo.keymasq.tools/releases/keymasq-${version}.tar.gz"

          python3 packaging/pacman/render.py \
            --aur-source-url "$aur_source_url" \
            --aur-sha256 "$archive_sha256"

      - name: Push AUR repo
        env:
          AUR_COMMIT_MESSAGE: "keymasq ${{ github.ref_name }}"
        run: |
          bash packaging/pacman/publish-aur.sh
