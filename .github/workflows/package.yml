name: Package

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - ".github/workflows/package.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PKGBUILD"
      - "README.md"
      - "assets/**"
      - "debian/**"
      - "docs/PACKAGING.md"
      - "examples/**"
      - "keyforge/**"
      - "keyforge.install"
      - "nfpm.yaml"
      - "packaging/aur/**"
      - "packaging/debian/**"
      - "packaging/pacman/**"
      - "packaging/rpm/**"
      - "polkit/**"
      - "pyproject.toml"
      - "scripts/build-packages.sh"
      - "scripts/build-source-tarball.sh"
      - "scripts/nfpm-*.sh"
      - "systemd/**"
      - "sysusers.d/**"
      - "tests/**"
      - "tmpfiles.d/**"
      - "udev/**"
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PKGBUILD"
      - "README.md"
      - "assets/**"
      - "debian/**"
      - "docs/PACKAGING.md"
      - "examples/**"
      - "keyforge/**"
      - "keyforge.install"
      - "nfpm.yaml"
      - "packaging/aur/**"
      - "packaging/debian/**"
      - "packaging/pacman/**"
      - "packaging/rpm/**"
      - "polkit/**"
      - "pyproject.toml"
      - "scripts/build-packages.sh"
      - "scripts/build-source-tarball.sh"
      - "scripts/nfpm-*.sh"
      - "systemd/**"
      - "sysusers.d/**"
      - "tests/**"
      - "tmpfiles.d/**"
      - "udev/**"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-metadata:
    runs-on: ubuntu-24.04
    outputs:
      is_master: ${{ steps.meta.outputs.is_master }}
      python_version: ${{ steps.meta.outputs.python_version }}
      debian_version: ${{ steps.meta.outputs.debian_version }}
      rpm_version: ${{ steps.meta.outputs.rpm_version }}
      pkgver: ${{ steps.meta.outputs.pkgver }}
      source_version: ${{ steps.meta.outputs.source_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute build version metadata
        id: meta
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          short_sha="${GITHUB_SHA:0:7}"

          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            python_version="${base_version}.dev${GITHUB_RUN_NUMBER}"
            debian_version="${base_version}~master.${GITHUB_RUN_NUMBER}+g${short_sha}-1"
            rpm_version="${base_version}~master.${GITHUB_RUN_NUMBER}+g${short_sha}"
            pkgver="${base_version}+r${GITHUB_RUN_NUMBER}+g${short_sha}"
            source_version="$pkgver"
            is_master=true
          else
            python_version="$base_version"
            debian_version=""
            rpm_version=""
            pkgver="$base_version"
            source_version="$base_version"
            is_master=false
          fi

          {
            printf 'is_master=%s\n' "$is_master"
            printf 'python_version=%s\n' "$python_version"
            printf 'debian_version=%s\n' "$debian_version"
            printf 'rpm_version=%s\n' "$rpm_version"
            printf 'pkgver=%s\n' "$pkgver"
            printf 'source_version=%s\n' "$source_version"
          } >> "$GITHUB_OUTPUT"

  build-source-tarball:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply master Python version
        if: needs.version-metadata.outputs.is_master == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}"

      - name: Build release source tarball
        run: |
          if [[ "${{ needs.version-metadata.outputs.is_master }}" == "true" ]]; then
            bash scripts/build-source-tarball.sh "${{ needs.version-metadata.outputs.source_version }}"
          else
            bash scripts/build-source-tarball.sh
          fi

      - name: Upload source tarball
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: source-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  build-pacman-arch:
    needs:
      - version-metadata
      - build-source-tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download source tarball
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Build rendered Arch package in Arch container
        env:
          KEYFORGE_PKGVER_OVERRIDE: ${{ needs.version-metadata.outputs.pkgver }}
        run: |
          docker run --rm \
            -e KEYFORGE_PKGVER_OVERRIDE \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                python \
                python-build \
                python-installer \
                python-setuptools \
                python-wheel
              bash packaging/pacman/ci-build.sh
            '

      - name: Upload Arch package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: pacman-arch-package
          path: dist/arch/*.pkg.tar.*
          if-no-files-found: error

  test-pacman-arch:
    needs: build-pacman-arch
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Arch package
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: pacman-arch-package
          path: dist/arch

      - name: Test Arch package in Arch container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              bash packaging/pacman/ci-test-installed.sh \
                "$(echo dist/arch/keyforge-*.pkg.tar.*)"
            '

  build-deb:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply master Debian build metadata
        if: needs.version-metadata.outputs.is_master == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}" \
            --debian-version "${{ needs.version-metadata.outputs.debian_version }}"

      - name: Build Debian package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                ca-certificates \
                debhelper \
                dh-sequence-python3 \
                lintian \
                pybuild-plugin-pyproject \
                python3-all \
                python3-build \
                python3-installer \
                python3-setuptools \
                python3-wheel
              bash packaging/debian/ci-build.sh
            '

      - name: Upload Debian artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: debian-package
          path: |
            dist/debian/*.deb
            dist/debian/*.changes
            dist/debian/*.buildinfo
          if-no-files-found: error

  test-deb:
    needs: build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Debian artifacts
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/debian

      - name: Test installed package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              bash packaging/debian/ci-test-installed.sh \
                "$(echo dist/debian/keyforge_*_all.deb)"
            '

  build-rpm-fedora:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply master RPM build metadata
        if: needs.version-metadata.outputs.is_master == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}" \
            --rpm-version "${{ needs.version-metadata.outputs.rpm_version }}"

      - name: Build Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                curl \
                findutils \
                gcc \
                python3 \
                python3-pip \
                shadow-utils \
                tar
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/install-nfpm.sh
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload Fedora RPM
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: rpm-fedora-package
          path: dist/*.fedora.*.rpm
          if-no-files-found: error

  test-rpm-fedora:
    needs: build-rpm-fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Fedora RPM
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: rpm-fedora-package
          path: dist/rpm

      - name: Prepare Fedora RPM for local act run
        if: ${{ env.ACT }}
        run: |
          mkdir -p dist/rpm
          cp -f dist/*.fedora.*.rpm dist/rpm/

      - name: Test Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y python3 systemd acl
              bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keyforge-*.fedora.*.rpm)"
            '

  build-rpm-opensuse:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply master RPM build metadata
        if: needs.version-metadata.outputs.is_master == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}" \
            --rpm-version "${{ needs.version-metadata.outputs.rpm_version }}"

      - name: Build openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install \
                curl \
                findutils \
                gcc \
                python3 \
                python3-pip \
                shadow \
                tar
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/install-nfpm.sh
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload openSUSE RPM
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: rpm-opensuse-package
          path: dist/*.opensuse.*.rpm
          if-no-files-found: error

  test-rpm-opensuse:
    needs: build-rpm-opensuse
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download openSUSE RPM
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: rpm-opensuse-package
          path: dist/rpm

      - name: Prepare openSUSE RPM for local act run
        if: ${{ env.ACT }}
        run: |
          mkdir -p dist/rpm
          cp -f dist/*.opensuse.*.rpm dist/rpm/

      - name: Test openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install python3 systemd acl
              bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keyforge-*.opensuse.*.rpm)"
            '

  release:
    needs:
      - build-source-tarball
      - build-pacman-arch
      - test-pacman-arch
      - build-deb
      - test-deb
      - build-rpm-fedora
      - test-rpm-fedora
      - build-rpm-opensuse
      - test-rpm-opensuse
    if: startsWith(github.ref, 'refs/tags/v') && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Download Debian artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/

      - name: Download Fedora RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-fedora-package
          path: dist/

      - name: Download openSUSE RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-opensuse-package
          path: dist/

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS

      - name: Generate artifact attestations
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

  release-master:
    needs:
      - build-source-tarball
      - build-pacman-arch
      - test-pacman-arch
      - build-deb
      - test-deb
      - build-rpm-fedora
      - test-rpm-fedora
      - build-rpm-opensuse
      - test-rpm-opensuse
    if: github.ref == 'refs/heads/master' && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Compute master release metadata
        id: meta
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          short_sha="${GITHUB_SHA:0:7}"
          tag="master-${stamp}-${short_sha}"
          name="Keyforge master ${stamp} (${short_sha})"
          {
            printf 'stamp=%s\n' "$stamp"
            printf 'short_sha=%s\n' "$short_sha"
            printf 'tag=%s\n' "$tag"
            printf 'name=%s\n' "$name"
          } >> "$GITHUB_OUTPUT"

      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Download Debian artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/

      - name: Download Fedora RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-fedora-package
          path: dist/

      - name: Download openSUSE RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-opensuse-package
          path: dist/

      - name: Generate master release checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS

      - name: Create GitHub prerelease for master
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Automated prerelease build from `master`.

            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

  publish-aur:
    needs:
      - release
      - test-pacman-arch
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_AUR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Configure SSH for AUR push
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Render AUR package files
        env:
          GITHUB_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          archive_path="dist/keyforge-${version}.tar.gz"
          archive_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          aur_source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_TAG}/keyforge-${version}.tar.gz"

          python3 packaging/pacman/render.py \
            --aur-source-url "$aur_source_url" \
            --aur-sha256 "$archive_sha256"

      - name: Push AUR repo
        env:
          AUR_COMMIT_MESSAGE: "keyforge ${{ github.ref_name }}"
        run: |
          bash packaging/pacman/publish-aur.sh
