name: Package

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - ".github/workflows/package.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PKGBUILD"
      - "README.md"
      - "assets/**"
      - "debian/**"
      - "docs/PACKAGING.md"
      - "examples/**"
      - "keyforge/**"
      - "keyforge.install"
      - "nfpm.yaml"
      - "packaging/aur/**"
      - "packaging/debian/**"
      - "packaging/pacman/**"
      - "packaging/rpm/**"
      - "polkit/**"
      - "pyproject.toml"
      - "scripts/build-packages.sh"
      - "scripts/build-source-tarball.sh"
      - "scripts/nfpm-*.sh"
      - "systemd/**"
      - "sysusers.d/**"
      - "tests/**"
      - "tmpfiles.d/**"
      - "udev/**"
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PKGBUILD"
      - "README.md"
      - "assets/**"
      - "debian/**"
      - "docs/PACKAGING.md"
      - "examples/**"
      - "keyforge/**"
      - "keyforge.install"
      - "nfpm.yaml"
      - "packaging/aur/**"
      - "packaging/debian/**"
      - "packaging/pacman/**"
      - "packaging/rpm/**"
      - "polkit/**"
      - "pyproject.toml"
      - "scripts/build-packages.sh"
      - "scripts/build-source-tarball.sh"
      - "scripts/nfpm-*.sh"
      - "systemd/**"
      - "sysusers.d/**"
      - "tests/**"
      - "tmpfiles.d/**"
      - "udev/**"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-source-tarball:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build release source tarball
        run: bash scripts/build-source-tarball.sh

      - name: Upload source tarball
        uses: actions/upload-artifact@v6
        with:
          name: source-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  test-aur-package:
    needs: build-source-tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Build rendered AUR package in Arch container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                python \
                python-build \
                python-installer \
                python-setuptools \
                python-wheel
              bash packaging/pacman/ci-test-aur-build.sh /workspace
            '

  build-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Debian package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                ca-certificates \
                debhelper \
                dh-sequence-python3 \
                lintian \
                pybuild-plugin-pyproject \
                python3-all \
                python3-build \
                python3-installer \
                python3-setuptools \
                python3-wheel
              bash packaging/debian/ci-build.sh
            '

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v6
        with:
          name: debian-package
          path: |
            dist/debian/*.deb
            dist/debian/*.changes
            dist/debian/*.buildinfo
          if-no-files-found: error

  test-deb:
    needs: build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Debian artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/debian

      - name: Test installed package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              bash packaging/debian/ci-test-installed.sh \
                "$(echo dist/debian/keyforge_*_all.deb)"
            '

  build-rpm-fedora:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                curl \
                findutils \
                gcc \
                python3 \
                python3-pip \
                shadow-utils \
                tar
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/install-nfpm.sh
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@v6
        with:
          name: rpm-fedora-package
          path: dist/*.fedora.*.rpm
          if-no-files-found: error

  test-rpm-fedora:
    needs: build-rpm-fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Fedora RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-fedora-package
          path: dist/rpm

      - name: Test Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y python3 systemd acl
              bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keyforge-*.fedora.*.rpm)"
            '

  build-rpm-opensuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install \
                curl \
                findutils \
                gcc \
                python3 \
                python3-pip \
                shadow \
                tar
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/install-nfpm.sh
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload openSUSE RPM
        uses: actions/upload-artifact@v6
        with:
          name: rpm-opensuse-package
          path: dist/*.opensuse.*.rpm
          if-no-files-found: error

  test-rpm-opensuse:
    needs: build-rpm-opensuse
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download openSUSE RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-opensuse-package
          path: dist/rpm

      - name: Test openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install python3 systemd acl
              bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keyforge-*.opensuse.*.rpm)"
            '

  release:
    needs:
      - build-source-tarball
      - build-deb
      - test-deb
      - build-rpm-fedora
      - test-rpm-fedora
      - build-rpm-opensuse
      - test-rpm-opensuse
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Download Debian artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/

      - name: Download Fedora RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-fedora-package
          path: dist/

      - name: Download openSUSE RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-opensuse-package
          path: dist/

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

  publish-aur:
    needs:
      - release
      - test-aur-package
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_AUR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Configure SSH for AUR push
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Render AUR package files
        env:
          GITHUB_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          archive_path="dist/keyforge-${version}.tar.gz"
          archive_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          aur_source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_TAG}/keyforge-${version}.tar.gz"

          python3 packaging/pacman/render.py \
            --aur-source-url "$aur_source_url" \
            --aur-sha256 "$archive_sha256"

      - name: Push AUR repo
        env:
          AUR_COMMIT_MESSAGE: "keyforge ${{ github.ref_name }}"
        run: |
          bash packaging/pacman/publish-aur.sh
