name: Package

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - ".github/workflows/package.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PKGBUILD"
      - "README.md"
      - "assets/**"
      - "debian/**"
      - "docs/PACKAGING.md"
      - "examples/**"
      - "keyforge/**"
      - "nfpm.yaml"
      - "packaging/debian/**"
      - "packaging/rpm/**"
      - "polkit/**"
      - "pyproject.toml"
      - "scripts/build-packages.sh"
      - "scripts/build-source-tarball.sh"
      - "scripts/nfpm-*.sh"
      - "systemd/**"
      - "sysusers.d/**"
      - "tests/**"
      - "tmpfiles.d/**"
      - "udev/**"
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PKGBUILD"
      - "README.md"
      - "assets/**"
      - "debian/**"
      - "docs/PACKAGING.md"
      - "examples/**"
      - "keyforge/**"
      - "nfpm.yaml"
      - "packaging/debian/**"
      - "packaging/rpm/**"
      - "polkit/**"
      - "pyproject.toml"
      - "scripts/build-packages.sh"
      - "scripts/build-source-tarball.sh"
      - "scripts/nfpm-*.sh"
      - "systemd/**"
      - "sysusers.d/**"
      - "tests/**"
      - "tmpfiles.d/**"
      - "udev/**"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-source-tarball:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release source tarball
        run: bash scripts/build-source-tarball.sh

      - name: Upload source tarball
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  build-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Debian package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                ca-certificates \
                debhelper \
                dh-sequence-python3 \
                lintian \
                pybuild-plugin-pyproject \
                python3-all \
                python3-build \
                python3-installer \
                python3-setuptools \
                python3-wheel
              bash packaging/debian/ci-build.sh
            '

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: |
            dist/debian/*.deb
            dist/debian/*.changes
            dist/debian/*.buildinfo
          if-no-files-found: error

  test-deb:
    needs: build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist/debian

      - name: Test installed package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              bash packaging/debian/ci-test-installed.sh \
                "$(echo dist/debian/keyforge_*_all.deb)"
            '

  build-rpm-fedora:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                curl \
                findutils \
                gcc \
                python3 \
                python3-pip \
                shadow-utils \
                tar
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/install-nfpm.sh
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora-package
          path: dist/*.fedora.*.rpm
          if-no-files-found: error

  test-rpm-fedora:
    needs: build-rpm-fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Fedora RPM
        uses: actions/download-artifact@v4
        with:
          name: rpm-fedora-package
          path: dist/rpm

      - name: Test Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y python3 systemd acl
              bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keyforge-*.fedora.*.rpm)"
            '

  build-rpm-opensuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install \
                curl \
                findutils \
                gcc \
                python3 \
                python3-pip \
                shadow \
                tar
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/install-nfpm.sh
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload openSUSE RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-opensuse-package
          path: dist/*.opensuse.*.rpm
          if-no-files-found: error

  test-rpm-opensuse:
    needs: build-rpm-opensuse
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download openSUSE RPM
        uses: actions/download-artifact@v4
        with:
          name: rpm-opensuse-package
          path: dist/rpm

      - name: Test openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install python3 systemd acl
              bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keyforge-*.opensuse.*.rpm)"
            '

  release:
    needs:
      - build-source-tarball
      - build-deb
      - test-deb
      - build-rpm-fedora
      - test-rpm-fedora
      - build-rpm-opensuse
      - test-rpm-opensuse
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: dist/

      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist/

      - name: Download Fedora RPM
        uses: actions/download-artifact@v4
        with:
          name: rpm-fedora-package
          path: dist/

      - name: Download openSUSE RPM
        uses: actions/download-artifact@v4
        with:
          name: rpm-opensuse-package
          path: dist/

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
