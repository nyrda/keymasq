name: Package

on:
  push:
    tags: ["v*"]
    paths:
      - ".github/workflows/package.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PKGBUILD"
      - "README.md"
      - "assets/**"
      - "debian/**"
      - "docs/PACKAGING.md"
      - "docs/INSTALL.md"
      - "examples/**"
      - "keymasq/**"
      - "keymasq.install"
      - "nfpm.yaml"
      - "packaging/aur/**"
      - "packaging/debian/**"
      - "packaging/pacman/**"
      - "packaging/rpm/**"
      - "polkit/**"
      - "pyproject.toml"
      - "scripts/build-packages.sh"
      - "scripts/build-source-tarball.sh"
      - "scripts/nfpm-*.sh"
      - "scripts/publish-repos.sh"
      - "systemd/**"
      - "sysusers.d/**"
      - "tests/**"
      - "tmpfiles.d/**"
      - "udev/**"
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "PKGBUILD"
      - "README.md"
      - "assets/**"
      - "debian/**"
      - "docs/PACKAGING.md"
      - "docs/INSTALL.md"
      - "examples/**"
      - "keymasq/**"
      - "keymasq.install"
      - "nfpm.yaml"
      - "packaging/aur/**"
      - "packaging/debian/**"
      - "packaging/pacman/**"
      - "packaging/rpm/**"
      - "polkit/**"
      - "pyproject.toml"
      - "scripts/build-packages.sh"
      - "scripts/build-source-tarball.sh"
      - "scripts/nfpm-*.sh"
      - "scripts/publish-repos.sh"
      - "systemd/**"
      - "sysusers.d/**"
      - "tests/**"
      - "tmpfiles.d/**"
      - "udev/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build the prerelease from
        required: true
        default: master
        type: string
      prerelease_tag:
        description: GitHub prerelease tag to create, for example v0.3.0-rc1
        required: true
        type: string
      prerelease_version:
        description: Package version to embed, for example 0.3.0rc1
        required: true
        type: string

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  KEYMASQ_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

jobs:
  version-metadata:
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      checkout_sha: ${{ steps.meta.outputs.checkout_sha }}
      is_manual_prerelease: ${{ steps.meta.outputs.is_manual_prerelease }}
      is_stable_release: ${{ steps.meta.outputs.is_stable_release }}
      python_version: ${{ steps.meta.outputs.python_version }}
      debian_version: ${{ steps.meta.outputs.debian_version }}
      rpm_version: ${{ steps.meta.outputs.rpm_version }}
      pkgver: ${{ steps.meta.outputs.pkgver }}
      source_version: ${{ steps.meta.outputs.source_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.KEYMASQ_CHECKOUT_REF }}

      - name: Compute build version metadata
        id: meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          CHECKOUT_REF: ${{ env.KEYMASQ_CHECKOUT_REF }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          PRERELEASE_VERSION: ${{ inputs.prerelease_version }}
        run: |
          set -euo pipefail
          base_version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          checkout_ref="$CHECKOUT_REF"
          checkout_sha="$(git rev-parse HEAD)"
          is_manual_prerelease=false
          is_stable_release=false
          release_tag=""
          release_name=""

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$PRERELEASE_TAG" || -z "$PRERELEASE_VERSION" ]]; then
              echo "workflow_dispatch requires prerelease_tag and prerelease_version" >&2
              exit 1
            fi
            if [[ "$PRERELEASE_TAG" != v* ]]; then
              echo "prerelease_tag must start with 'v'" >&2
              exit 1
            fi

            python_version="$PRERELEASE_VERSION"
            debian_version="$(python3 - "$PRERELEASE_VERSION" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          match = re.fullmatch(r"(.+?)(?:(a|b|rc)(\d+)|\.dev(\d+))", version)
          if match is None:
              print(version)
          else:
              base, prerelease_label, prerelease_number, dev_number = match.groups()
              if dev_number is not None:
                  print(f"{base}~dev{dev_number}")
              else:
                  print(f"{base}~{prerelease_label}{prerelease_number}")
          PY
            )"
            rpm_version="$debian_version"
            pkgver="$PRERELEASE_VERSION"
            source_version="$PRERELEASE_VERSION"
            release_tag="$PRERELEASE_TAG"
            release_name="Keymasq prerelease ${PRERELEASE_TAG#v}"
            is_manual_prerelease=true
          elif [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF" != *-* ]]; then
            python_version="$base_version"
            debian_version=""
            rpm_version=""
            pkgver="$base_version"
            source_version="$base_version"
            release_tag="${GITHUB_REF#refs/tags/}"
            is_stable_release=true
          else
            python_version="$base_version"
            debian_version=""
            rpm_version=""
            pkgver="$base_version"
            source_version="$base_version"
          fi

          {
            printf 'checkout_ref=%s\n' "$checkout_ref"
            printf 'checkout_sha=%s\n' "$checkout_sha"
            printf 'is_manual_prerelease=%s\n' "$is_manual_prerelease"
            printf 'is_stable_release=%s\n' "$is_stable_release"
            printf 'python_version=%s\n' "$python_version"
            printf 'debian_version=%s\n' "$debian_version"
            printf 'rpm_version=%s\n' "$rpm_version"
            printf 'pkgver=%s\n' "$pkgver"
            printf 'source_version=%s\n' "$source_version"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'release_name=%s\n' "$release_name"
          } >> "$GITHUB_OUTPUT"

  build-source-tarball:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Apply prerelease Python version
        if: needs.version-metadata.outputs.is_manual_prerelease == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}"

      - name: Build source tarball
        run: |
          if [[ "${{ needs.version-metadata.outputs.is_manual_prerelease }}" == "true" ]]; then
            bash scripts/build-source-tarball.sh "${{ needs.version-metadata.outputs.source_version }}"
          else
            bash scripts/build-source-tarball.sh
          fi

      - name: Upload source tarball
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: source-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  build-pacman-arch:
    needs:
      - version-metadata
      - build-source-tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Download source tarball
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Build rendered Arch package in Arch container
        env:
          KEYMASQ_PKGVER_OVERRIDE: ${{ needs.version-metadata.outputs.pkgver }}
        run: |
          docker run --rm \
            -e KEYMASQ_PKGVER_OVERRIDE \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                python \
                python-build \
                python-installer \
                python-setuptools \
                python-wheel
              bash packaging/pacman/ci-build.sh
            '

      - name: Upload Arch package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: pacman-arch-package
          path: dist/arch/*.pkg.tar.*
          if-no-files-found: error

  test-pacman-arch:
    needs:
      - version-metadata
      - build-pacman-arch
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Download Arch package
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: pacman-arch-package
          path: dist/arch

      - name: Test Arch package in Arch container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              bash packaging/pacman/ci-test-installed.sh \
                "$(echo dist/arch/keymasq-*.pkg.tar.*)"
            '

  build-deb:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Apply prerelease Debian build metadata
        if: needs.version-metadata.outputs.is_manual_prerelease == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}" \
            --debian-version "${{ needs.version-metadata.outputs.debian_version }}"

      - name: Build Debian package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                ca-certificates \
                debhelper \
                dh-sequence-python3 \
                lintian \
                pybuild-plugin-pyproject \
                python3-all \
                python3-build \
                python3-installer \
                python3-setuptools \
                python3-wheel
              bash packaging/debian/ci-build.sh
            '

      - name: Upload Debian artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: debian-package
          path: |
            dist/debian/*.deb
            dist/debian/*.changes
            dist/debian/*.buildinfo
          if-no-files-found: error

  test-deb:
    needs:
      - version-metadata
      - build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Download Debian artifacts
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/debian

      - name: Test installed package in Debian container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -euo pipefail
              bash packaging/debian/ci-test-installed.sh \
                "$(echo dist/debian/keymasq_*_all.deb)"
            '

  build-rpm-fedora:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Apply prerelease RPM build metadata
        if: needs.version-metadata.outputs.is_manual_prerelease == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}" \
            --rpm-version "${{ needs.version-metadata.outputs.rpm_version }}"

      - name: Build Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                curl \
                findutils \
                gcc \
                python3 \
                python3-pip \
                shadow-utils \
                tar
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/install-nfpm.sh
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload Fedora RPM
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: rpm-fedora-package
          path: dist/*.fedora.*.rpm
          if-no-files-found: error

  test-rpm-fedora:
    needs:
      - version-metadata
      - build-rpm-fedora
    if: needs.version-metadata.outputs.is_stable_release != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Download Fedora RPM
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: rpm-fedora-package
          path: dist/rpm

      - name: Prepare Fedora RPM for local act run
        if: ${{ env.ACT }}
        run: |
          mkdir -p dist/rpm
          cp -f dist/*.fedora.*.rpm dist/rpm/

      - name: Test Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y python3 systemd acl
              bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keymasq-*.fedora.*.rpm)"
            '

  build-rpm-opensuse:
    needs: version-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Apply prerelease RPM build metadata
        if: needs.version-metadata.outputs.is_manual_prerelease == 'true'
        run: |
          python3 scripts/rewrite-build-metadata.py \
            --python-version "${{ needs.version-metadata.outputs.python_version }}" \
            --rpm-version "${{ needs.version-metadata.outputs.rpm_version }}"

      - name: Build openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install \
                curl \
                findutils \
                gcc \
                python3 \
                python3-pip \
                shadow \
                tar
              PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install build setuptools wheel
              bash packaging/rpm/install-nfpm.sh
              bash packaging/rpm/ci-build.sh
            '

      - name: Upload openSUSE RPM
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v6
        with:
          name: rpm-opensuse-package
          path: dist/*.opensuse.*.rpm
          if-no-files-found: error

  test-rpm-opensuse:
    needs:
      - version-metadata
      - build-rpm-opensuse
    if: needs.version-metadata.outputs.is_stable_release != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Download openSUSE RPM
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: rpm-opensuse-package
          path: dist/rpm

      - name: Prepare openSUSE RPM for local act run
        if: ${{ env.ACT }}
        run: |
          mkdir -p dist/rpm
          cp -f dist/*.opensuse.*.rpm dist/rpm/

      - name: Test openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install python3 systemd acl
              bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keymasq-*.opensuse.*.rpm)"
            '

  sign-rpm-packages:
    needs:
      - version-metadata
      - build-rpm-fedora
      - build-rpm-opensuse
    if: needs.version-metadata.outputs.is_stable_release == 'true' && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Install RPM signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg rpm

      - name: Download Fedora RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-fedora-package
          path: dist/

      - name: Download openSUSE RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-opensuse-package
          path: dist/

      - name: Sign RPM artifacts
        env:
          RPM_SIGNING_KEY_PRIVATE_ASC: ${{ secrets.RPM_SIGNING_KEY_PRIVATE_ASC }}
          RPM_SIGNING_PUBLIC_KEY_PATH: dist/rpm-signing-key.asc
        run: |
          test -n "$RPM_SIGNING_KEY_PRIVATE_ASC"
          bash packaging/rpm/sign-rpms.sh dist/*.rpm

      - name: Upload signed RPM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rpm-signed-packages
          path: |
            dist/*.rpm
            dist/rpm-signing-key.asc
          if-no-files-found: error

  test-rpm-fedora-signed:
    needs:
      - version-metadata
      - sign-rpm-packages
    if: needs.sign-rpm-packages.result == 'success' && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Download signed RPM artifacts
        uses: actions/download-artifact@v8
        with:
          name: rpm-signed-packages
          path: dist/rpm

      - name: Test signed Fedora RPM in Fedora container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              dnf install -y python3 systemd acl
              KEYMASQ_RPM_SIGNING_PUBLIC_KEY_PATH=dist/rpm/rpm-signing-key.asc \
                bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keymasq-*.fedora.*.rpm)"
            '

  test-rpm-opensuse-signed:
    needs:
      - version-metadata
      - sign-rpm-packages
    if: needs.sign-rpm-packages.result == 'success' && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Download signed RPM artifacts
        uses: actions/download-artifact@v8
        with:
          name: rpm-signed-packages
          path: dist/rpm

      - name: Test signed openSUSE RPM in openSUSE container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install python3 systemd acl
              KEYMASQ_RPM_SIGNING_PUBLIC_KEY_PATH=dist/rpm/rpm-signing-key.asc \
                bash packaging/rpm/ci-test-installed.sh \
                "$(echo dist/rpm/keymasq-*.opensuse.*.rpm)"
            '

  release:
    needs:
      - version-metadata
      - build-source-tarball
      - build-pacman-arch
      - test-pacman-arch
      - build-deb
      - test-deb
      - sign-rpm-packages
      - test-rpm-fedora-signed
      - test-rpm-opensuse-signed
    if: needs.version-metadata.outputs.is_stable_release == 'true' && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Download Debian artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/

      - name: Download signed RPM artifacts
        uses: actions/download-artifact@v8
        with:
          name: rpm-signed-packages
          path: dist/

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum ./*.deb ./*.rpm ./*.tar.gz ./rpm-signing-key.asc > SHA256SUMS

      - name: Generate artifact attestations
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/rpm-signing-key.asc
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.rpm
            dist/*.tar.gz
            dist/rpm-signing-key.asc
            dist/SHA256SUMS
          generate_release_notes: true

  release-prerelease:
    needs:
      - version-metadata
      - build-source-tarball
      - build-pacman-arch
      - test-pacman-arch
      - build-deb
      - test-deb
      - build-rpm-fedora
      - test-rpm-fedora
      - build-rpm-opensuse
      - test-rpm-opensuse
    if: needs.version-metadata.outputs.is_manual_prerelease == 'true' && github.actor != 'nektos/act'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Download Debian artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/

      - name: Download Fedora RPM artifacts
        uses: actions/download-artifact@v8
        with:
          name: rpm-fedora-package
          path: dist/

      - name: Download openSUSE RPM artifacts
        uses: actions/download-artifact@v8
        with:
          name: rpm-opensuse-package
          path: dist/

      - name: Generate prerelease checksums
        run: |
          cd dist
          sha256sum ./*.deb ./*.rpm ./*.tar.gz > SHA256SUMS

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-metadata.outputs.release_tag }}
          target_commitish: ${{ needs.version-metadata.outputs.checkout_sha }}
          name: ${{ needs.version-metadata.outputs.release_name }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Manual prerelease build from `${{ needs.version-metadata.outputs.checkout_ref }}`.

            Commit: https://github.com/${{ github.repository }}/commit/${{ needs.version-metadata.outputs.checkout_sha }}
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            dist/*.deb
            dist/*.changes
            dist/*.buildinfo
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

  publish-repos:
    needs:
      - version-metadata
      - release
    if: needs.release.result == 'success' && vars.ENABLE_REPO_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-repos

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Install repo tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg dpkg-dev apt-utils createrepo-c

      - name: Download Debian package
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/

      - name: Download signed RPM packages
        uses: actions/download-artifact@v8
        with:
          name: rpm-signed-packages
          path: dist/

      - name: Publish to repository server
        env:
          RPM_SIGNING_KEY_PRIVATE_ASC: ${{ secrets.RPM_SIGNING_KEY_PRIVATE_ASC }}
          REPO_UPLOAD_URL: ${{ secrets.REPO_UPLOAD_URL }}
          REPO_UPLOAD_TOKEN: ${{ secrets.REPO_UPLOAD_TOKEN }}
        run: bash scripts/publish-repos.sh

  publish-aur:
    needs:
      - version-metadata
      - release
      - test-pacman-arch
    if: needs.release.result == 'success' && vars.ENABLE_AUR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-metadata.outputs.checkout_ref }}

      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: dist/

      - name: Configure SSH for AUR push
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Render AUR package files
        env:
          GITHUB_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          archive_path="dist/keymasq-${version}.tar.gz"
          archive_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          aur_source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_TAG}/keymasq-${version}.tar.gz"

          python3 packaging/pacman/render.py \
            --aur-source-url "$aur_source_url" \
            --aur-sha256 "$archive_sha256"

      - name: Push AUR repo
        env:
          AUR_COMMIT_MESSAGE: "keymasq ${{ github.ref_name }}"
        run: |
          bash packaging/pacman/publish-aur.sh
