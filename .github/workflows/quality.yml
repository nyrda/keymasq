name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-and-basedpyright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify Nix
        run: nix --version

      - name: Ruff
        run: nix develop -c bash -lc 'ruff check keymasq tests'

      - name: BasedPyright
        run: nix develop -c bash -lc 'basedpyright'
