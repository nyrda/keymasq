name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify Nix
        run: nix --version

      - name: Install Xvfb
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          else
            apt-get update
            apt-get install -y xvfb
          fi

      - name: Run Ruff, BasedPyright, and pytest
        run: |
          xvfb-run -a nix develop -c bash -lc '
            set -euo pipefail
            ruff check keymasq tests
            basedpyright
            pytest tests -v
          '
