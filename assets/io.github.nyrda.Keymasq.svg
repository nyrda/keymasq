<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- KeyForge Icon v8 — Simple orange K on dark keycap -->
  <defs>
    <linearGradient id="capOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#404048"/>
      <stop offset="100%" style="stop-color:#28282e"/>
    </linearGradient>
    <linearGradient id="capInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333338"/>
      <stop offset="100%" style="stop-color:#1e1e24"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ee5520;stop-opacity:0.15"/>
      <stop offset="70%" style="stop-color:#ee4400;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#ee4400;stop-opacity:0"/>
    </radialGradient>

    <filter id="letterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2"/>
      <feComposite operator="out" in="SourceGraphic"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="64" cy="64" r="60" fill="url(#ambientGlow)"/>

  <!-- Keycap outer body (sits higher, like a real keycap) -->
  <rect x="14" y="18" width="100" height="98" rx="18" fill="url(#capOuter)" stroke="#4a4a52" stroke-width="1.5"/>

  <!-- Keycap inner face: x=24 y=24 w=80 h=76 => center is (64, 62) -->
  <rect x="24" y="24" width="80" height="76" rx="13" fill="url(#capInner)" filter="url(#innerShadow)"/>
  <rect x="24" y="24" width="80" height="76" rx="13" fill="none" stroke="#4a4a50" stroke-width="0.5" opacity="0.6"/>

  <!-- Orange K letter centered in inner frame (center y=62).
       y=82 is the alphabetic baseline: cap-height ~40px (0.72*56),
       so visual center lands at 82-20=62. Plain px value — no em units,
       no dominant-baseline — works in Qt SVG and librsvg. -->
  <text filter="url(#letterGlow)" x="64" y="82" font-family="sans-serif" font-size="56" font-weight="700" fill="#e85520" text-anchor="middle">K</text>

  <text x="64" y="82" font-family="sans-serif" font-size="56" font-weight="700" fill="#ee6625" text-anchor="middle">K</text>
</svg>
