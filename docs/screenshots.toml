# Keymasq documentation screenshot manifest.
#
# The docshot VM renders dark screenshots by default. It can render light
# screenshots on demand:
# - dark:  docs/assets/screenshots/<name>.png
# - light: docs/assets/screenshots/light/<name>.png
#
# `target` is resolved by nix/docshots/gui_driver.py.  The names intentionally
# match existing checked-in screenshots so docs links do not need per-shot
# metadata.

[settings]
dark_output_dir = "docs/assets/screenshots"
light_output_dir = "docs/assets/screenshots/light"
default_mode = "dark"
window_width = 760
window_height = 1000
selector_width = 1100
selector_height = 900
settle_ms = 700

