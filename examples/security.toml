daemon_allowed_uids = []
session_allowed_uids = []

[macro]
exec_timeout_max_ms = 30000

[gui]
# Inject Ctrl+Alt+Esc on grabbed keyboards as the emergency cancel/reset combo.
emergency_cancel_combo_enabled = true

[recording_guard]
# Allow macro recording. Set to false to disable it for all users.
macro_recording_allowed = true
# Stop a recording normally after this many minutes. Set to 0 for no time limit.
macro_recording_time_limit = 10
