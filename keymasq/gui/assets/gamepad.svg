<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 100 660 430" width="100%" height="100%">
  <title>Game controller</title>
  <desc>A graphite controller with offset thumbsticks, a directional pad, four colored face buttons, and an unbranded home button.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.2" y2="1">
      <stop stop-color="#777b83"/>
      <stop offset="0.55" stop-color="#62666e"/>
      <stop offset="1" stop-color="#4d5159"/>
    </linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#42464e"/>
      <stop offset="1" stop-color="#2d3037"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a6a9af"/>
      <stop offset="1" stop-color="#757981"/>
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Triggers and shoulders sit behind the shell. -->
    <g fill="#3a3d44" stroke="#81858d" stroke-width="2.5">
      <path d="M 239 165 L 241 152 Q 242 148 247 148 H 265 Q 270 148 272 152 L 278 165 Z"/>
      <path d="M 561 165 L 559 152 Q 558 148 553 148 H 535 Q 530 148 528 152 L 522 165 Z"/>
    </g>
    <g fill="#454950" stroke="#8d9199" stroke-width="2.5">
      <path d="M 200 190 Q 211 172 234 166 Q 266 158 298 167 L 313 180 Z"/>
      <path d="M 600 190 Q 589 172 566 166 Q 534 158 502 167 L 487 180 Z"/>
    </g>

    <!-- Continuous outer edge remains visible on light and dark backgrounds. -->
    <path d="M 400 191
             C 362 191 338 169 289 168
             C 216 166 168 209 151 278
             C 136 337 121 421 140 467
             C 153 500 190 511 220 496
             C 258 477 284 426 324 413
             C 365 400 435 400 476 413
             C 516 426 542 477 580 496
             C 610 511 647 500 660 467
             C 679 421 664 337 649 278
             C 632 209 584 166 511 168
             C 462 169 438 191 400 191 Z"
          fill="url(#shell)" stroke="url(#rim)" stroke-width="3"/>

    <!-- Subtle grip seams keep the shell uncluttered at picker size. -->
    <g fill="none" stroke="#b2b5bb" stroke-opacity="0.18" stroke-width="2">
      <path d="M 181 346 C 165 402 162 449 183 463"/>
      <path d="M 619 346 C 635 402 638 449 617 463"/>
    </g>

    <!-- Dark thumbstick wells and softly edged caps. -->
    <g stroke-width="3">
      <g fill="#33363d" stroke="#82868e" stroke-width="2">
        <circle cx="258" cy="263" r="47"/>
        <circle cx="490" cy="349" r="47"/>
      </g>
      <g fill="url(#control)" stroke="#8b9099" stroke-width="2.5">
        <circle cx="258" cy="261" r="34"/>
        <circle cx="490" cy="347" r="34"/>
      </g>
    </g>

    <!-- Rounded directional pad. -->
    <g transform="translate(310 351)">
      <circle r="46" fill="#33363d" stroke="#82868e" stroke-width="2"/>
      <path d="M -9 -34 H 9 Q 13 -34 13 -30 V -13 H 30 Q 34 -13 34 -9
               V 9 Q 34 13 30 13 H 13 V 30 Q 13 34 9 34
               H -9 Q -13 34 -13 30 V 13 H -30 Q -34 13 -34 9
               V -9 Q -34 -13 -30 -13 H -13 V -30 Q -13 -34 -9 -34 Z"
            fill="url(#control)" stroke="#9b9fa7" stroke-width="2.5"/>
    </g>

    <!-- Generic view, home, and menu controls. -->
    <g fill="#363940" stroke="#93979f" stroke-width="2">
      <rect x="327" y="240" width="29" height="22" rx="11"/>
      <circle cx="400" cy="248" r="22"/>
      <rect x="444" y="240" width="29" height="22" rx="11"/>
    </g>
    <g fill="none" stroke="#c7cfd8" stroke-width="2.5">
      <path d="M 336 250 V 246 H 344 M 340 250 H 347 V 256 H 340 Z"/>
      <path d="M 390 247 L 400 239 L 410 247 M 393 245 V 257 H 407 V 245"/>
      <path d="M 453 247 H 464 M 453 252 H 464 M 453 257 H 464"/>
    </g>
    <rect x="392" y="286" width="16" height="4" rx="2" fill="#a6c5c9"/>

    <!-- Muted face-button colors; outlined letters avoid font dependencies. -->
    <g fill="#33363d" stroke-width="2.5">
      <circle cx="550" cy="218" r="19" stroke="#d9bd76"/>
      <circle cx="513" cy="255" r="19" stroke="#83b9de"/>
      <circle cx="587" cy="255" r="19" stroke="#da9692"/>
      <circle cx="550" cy="292" r="19" stroke="#9bc6a2"/>
    </g>
    <g fill="none" stroke-width="3">
      <path d="M 544 211 L 550 219 L 556 211 M 550 219 V 226" stroke="#e8cf91"/>
      <path d="M 507 248 L 519 262 M 519 248 L 507 262" stroke="#a0ccef"/>
      <path d="M 582 262 V 248 H 588 C 595 248 595 255 588 255 H 582
               M 588 255 C 596 255 596 262 588 262 H 582" stroke="#edafaa"/>
      <path d="M 544 299 L 550 285 L 556 299 M 547 294 H 553" stroke="#b5dcbc"/>
    </g>
  </g>
</svg>
