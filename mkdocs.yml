site_name: Keymasq
site_description: Input customization for Linux — remap keyboards, mice, and gamepads with macros, combos, superkeys, and autoclicker workflows.
site_url: https://keymasq.tools/docs/latest/
repo_url: https://github.com/nyrda/keymasq
repo_name: nyrda/keymasq
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

# llms.txt is intentionally a static asset, not a human navigation page.
# MkDocs copies non-Markdown files from docs_dir into the built site.
not_in_nav: |
  llms.txt
  agents/*.txt

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nyrda/keymasq
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# Docs intentionally omitted from the published site (developer-facing):
#   - DEPENDENCIES.md
#   - LISTENER_VM_TESTS.md
#   - PACKAGING.md
#   - SCREENSHOTS.md
#   - VM_TESTING.md
#   - WAYLAND_PROTOCOL_TRACKERS.md
# They stay in the repo; just not linked from nav.
nav:
  - Home: index.md
  - Install: INSTALL.md
  - Getting Started: GETTING_STARTED.md
  - User Guide:
      - Profiles: PROFILES.md
      - Actions: ACTIONS.md
      - Analog Controls: ANALOG_CONTROLS.md
      - Superkeys: SUPERKEYS.md
      - Combos: COMBOS.md
      - Macros: MACROS.md
      - Gamepad: GAMEPAD.md
  - Examples:
      - Overview: EXAMPLES.md
      - Custom Modifier Combos: examples/custom-modifier-combos.md
      - Mouse UI Automation: examples/mouse-ui-automation.md
      - Text Snippet Macro: examples/text-snippet-macro.md
      - Universal Copy and Paste: examples/universal-copy-paste.md
      - Volume Rocker Key: examples/volume-rocker-superkey.md
  - Desktop Support:
      - Wayland: WAYLAND.md
      - GNOME: GNOME.md
  - Reference:
      - CLI: CLI.md
      - Performance: PERFORMANCE.md
      - Security: SECURITY.md
      - Troubleshooting: TROUBLESHOOTING.md
