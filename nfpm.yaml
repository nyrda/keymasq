name: keymasq
arch: x86_64
platform: linux
version: 0.3.2
release: 1
maintainer: nyrda <nyrda@keymasq.tools>
description: A key remapping tool for Linux using evdev and uinput
vendor: nyrda
homepage: https://keymasq.tools
license: MIT

depends:
  - acl
  - "python3 >= 3.12"
  - ${RPM_EVDEV_DEP}
  - ${RPM_TOMLI_W_DEP}
  - ${RPM_DBUS_NEXT_DEP}
  - ${RPM_XLIB_DEP}
  - ${RPM_PYGOBJECT_DEP}
  - ${RPM_GTK_DEP}
  - ${RPM_ADW_DEP}
  - polkit
  - systemd

recommends:
  - slurp

contents:
  - src: staging/rpm${RPM_PYTHON_SITELIB}/
    dst: ${RPM_PYTHON_SITELIB}
    type: tree
    expand: true

  - src: staging/rpm/usr/bin/keymasqd
    dst: /usr/bin/keymasqd
  - src: staging/rpm/usr/bin/keymasq-session
    dst: /usr/bin/keymasq-session
  - src: staging/rpm/usr/bin/keymasq
    dst: /usr/bin/keymasq
  - src: staging/rpm/usr/bin/keymasq-record
    dst: /usr/bin/keymasq-record

  - src: systemd/keymasqd.service
    dst: /usr/lib/systemd/system/keymasqd.service
  - src: systemd/keymasq-session.service
    dst: /usr/lib/systemd/user/keymasq-session.service

  - src: sysusers.d/keymasq.conf
    dst: /usr/lib/sysusers.d/keymasq.conf
  - src: tmpfiles.d/keymasq.conf
    dst: /usr/lib/tmpfiles.d/keymasq.conf

  - src: udev/91-keymasq-acl.rules
    dst: /usr/lib/udev/rules.d/91-keymasq-acl.rules

  - src: polkit/com.keymasq.record-macro.policy
    dst: /usr/share/polkit-1/actions/com.keymasq.record-macro.policy

  - src: assets/io.github.nyrda.Keymasq.desktop
    dst: /usr/share/applications/io.github.nyrda.Keymasq.desktop
  - src: assets/io.github.nyrda.Keymasq.metainfo.xml
    dst: /usr/share/metainfo/io.github.nyrda.Keymasq.metainfo.xml
  - src: assets/io.github.nyrda.Keymasq.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.nyrda.Keymasq.svg
  - src: assets/icons/io.github.nyrda.Keymasq-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/io.github.nyrda.Keymasq.png
  - src: assets/icons/io.github.nyrda.Keymasq-22.png
    dst: /usr/share/icons/hicolor/22x22/apps/io.github.nyrda.Keymasq.png
  - src: assets/icons/io.github.nyrda.Keymasq-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/io.github.nyrda.Keymasq.png
  - src: assets/icons/io.github.nyrda.Keymasq-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/io.github.nyrda.Keymasq.png
  - src: assets/icons/io.github.nyrda.Keymasq-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.nyrda.Keymasq.png
  - src: assets/icons/io.github.nyrda.Keymasq-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.nyrda.Keymasq.png
  - src: assets/icons/io.github.nyrda.Keymasq-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.nyrda.Keymasq.png
  - src: assets/icons/io.github.nyrda.Keymasq-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.nyrda.Keymasq.png
  - src: assets/icons/io.github.nyrda.Keymasq-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.nyrda.Keymasq.png

  - src: examples/security.toml
    dst: /etc/keymasq/security.toml
    type: config|noreplace

  - src: gnome-extension/keymasq-bridge@nyrda/
    dst: /usr/share/gnome-shell/extensions/keymasq-bridge@nyrda/
    type: tree

  - src: LICENSE
    dst: /usr/share/licenses/keymasq/LICENSE
  - src: README.md
    dst: /usr/share/doc/keymasq/README.md

scripts:
  postinstall: scripts/nfpm-postinstall.sh
  preremove: scripts/nfpm-preremove.sh
  postremove: scripts/nfpm-postremove.sh
