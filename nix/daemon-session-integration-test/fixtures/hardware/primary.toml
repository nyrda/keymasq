[hardware]
name = "Keymasq Integration Source Keyboard"
vendor_id = "cafe"
product_id = "0001"

[[hardware.evdev.devices]]
path = "$PRIMARY_SOURCE_PATH"
type = "keyboard"
id = "kbd"

[hardware.layout]
type = "keyboard"

$PRIMARY_BUTTONS

[[hardware.layout.analogs]]
id = "left_stick"
label = "Left Stick"
type = "stick"
axes = [
  { role = "x", evdev = "abs_x", minimum = -32768, maximum = 32767, center = 0 },
  { role = "y", evdev = "abs_y", minimum = -32768, maximum = 32767, center = 0 },
]

[[hardware.layout.analogs]]
id = "left_trigger"
label = "Left Trigger"
type = "axis"
axes = [
  { role = "x", evdev = "abs_z", minimum = 0, maximum = 255, rest = 0 },
]

[[hardware.layout.analogs]]
id = "signed_axis"
label = "Signed Axis"
type = "axis"
axes = [
  { role = "x", evdev = "abs_rx", minimum = -32768, maximum = 32767, rest = 0 },
]
