[profile]
name = "$BLOCK_PROFILE_NAME"
enabled = false
is_permanent = true
priority = 610
notify_on_activation = false
created_at = "2026-10-10T00:00:00"

[devices."$HARDWARE_ID"]
always_grab_all = false

[devices."$HARDWARE_ID".mapping.key_f13]
action = "macro"
target = "$BLOCKING_MACRO_NAME"

[devices."$HARDWARE_ID".mapping.key_f15]
action = "keyboard"
target = "key_left"

[devices."$HARDWARE_ID".mapping.key_f16]
action = "keyboard"
target = "key_right"

[devices."$HARDWARE_ID".mapping.key_t]
action = "emergency_reset"

[[rollover_groups]]
name = "Block Snap Tap"
members = [
  { hardware_id = "$HARDWARE_ID", button = "key_f15" },
  { hardware_id = "$HARDWARE_ID", button = "key_f16" },
]
winner = "newest"
restore = true
