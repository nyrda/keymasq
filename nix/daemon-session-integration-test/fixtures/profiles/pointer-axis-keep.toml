[profile]
name = "Integration Pointer Axis Keep"
enabled = false
is_permanent = true
priority = 160
notify_on_activation = false
created_at = "2026-09-27T00:00:05"

[devices."$MOUSE_HARDWARE_ID"]
always_grab_all = false

[devices."$MOUSE_HARDWARE_ID".mapping.pointer]
action = "pointer_movement"
mode = "axes"
behavior = "position"
radius = 1000.0
overshoot = "keep"
x_axis = "abs_x"
y_axis = "none"
