[profile]
name = "Integration Pointer Axis Position"
enabled = false
is_permanent = true
priority = 150
notify_on_activation = false
created_at = "2026-09-27T00:00:04"

[devices."$MOUSE_HARDWARE_ID"]
always_grab_all = false

[devices."$MOUSE_HARDWARE_ID".mapping.pointer]
action = "pointer_movement"
mode = "axes"
behavior = "position"
radius = 1000.0
overshoot = "drag"
x_axis = "abs_x"
y_axis = "abs_rz"
y_direction = "max"
invert_y = true
