[profile]
name = "Integration Pointer Axis Recenter"
enabled = false
is_permanent = true
priority = 170
notify_on_activation = false
created_at = "2026-09-27T00:00:06"

[devices."$MOUSE_HARDWARE_ID"]
always_grab_all = false

[devices."$MOUSE_HARDWARE_ID".mapping.pointer]
action = "pointer_movement"
mode = "axes"
behavior = "position"
radius = 1000.0
recenter_ms = 150
minimum_output = 0.5
x_axis = "abs_x"
y_axis = "none"
