# Create runtime and state directories for keymasq daemon.
d /run/keymasq 0755 keymasq keymasq -
d /var/lib/keymasq 0750 keymasq keymasq -
# Repair state left by an older keymasq UID. The d line above fixes only the
# top directory, which makes StateDirectory= skip its recursive chown.
Z /var/lib/keymasq - keymasq keymasq -
# Required before the hardware job creates its filesystem namespace.
d /run/udev/rules.d 0755 root root -
